<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="./quizgame.css" />
  </head>
  <body>
    <div class="container">
      <h1>Quiz Application</h1>

      <div id="scoreDisplay" style="color: green;"></div>
      <div>
        <p id="questionNum" style="margin-top: 20px;"></p>
        <h2 id="showQuestion" style="margin-top: 10px; margin-bottom: 10px;"></h2>

        <div id="optionsContainer"></div>
        <!-- <input type="radio" id="questionOption" value="red" /> Red<br /> -->
      </div>

      <div class="button">
        <button class="but" onclick="goLeft()" id="buttOne">Prev</button>
        <button class="but" onclick="goRight()" id="buttTwo">Next</button>
      </div>

      <button class="submit" onclick="submitQuiz()">Submit</button>
    </div>
  </body>
  <script src="./quizgame.js"></script>
</html>
